name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/

      - name: Test imports
        run: |
          python -c "
          from slipcore import (
              format_slip, parse_slip, validate_wire, SlipMessage,
              ForceToken, ObjectToken, Intent, resolve_intent, from_v2_mnemonic,
              UCR, UCRAnchor, create_base_ucr,
              render_human, render_log_line,
              KeywordQuantizer, quantize, think_quantize_transmit,
              ExtensionManager, FallbackTracker,
              emit, register_sink, clear_sinks,
          )
          print('All imports OK')
          "

      - name: Test core functionality
        run: |
          python -c "
          from slipcore import format_slip, parse_slip, render_human

          # Test format/parse roundtrip
          wire = format_slip('alice', 'bob', 'Request', 'Review', ['auth'])
          msg = parse_slip(wire)
          assert msg.src == 'alice'
          assert msg.dst == 'bob'
          assert msg.force == 'Request'
          assert msg.obj == 'Review'
          assert msg.payload == ('auth',)
          assert wire == 'SLIP v3 alice bob Request Review auth'

          # Test render
          human = render_human(msg)
          assert 'alice' in human and 'bob' in human

          print('All core tests passed!')
          "

      - name: Test quantization
        run: |
          python -c "
          from slipcore import KeywordQuantizer

          q = KeywordQuantizer()
          result = q.quantize('please review my code')
          assert result.force == 'Request'
          assert result.obj == 'Review'

          print('Quantization test passed!')
          "

      - name: Test dataset generation
        run: |
          python -c "
          from slipcore.finetune import generate_training_examples
          examples = generate_training_examples(num_examples=10)
          assert len(examples) == 10
          assert all(e.response.startswith('SLIP v3') for e in examples)
          print(f'Generated {len(examples)} v3 examples')
          "

      - name: Run test suite
        run: pytest tests/ -v --tb=short
