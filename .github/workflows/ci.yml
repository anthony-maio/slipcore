name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: ruff check src/

      - name: Type check with mypy
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: mypy src/slipcore/

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest tests/ -v --tb=short

  release_gate:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine

      - name: Check required release files
        run: python scripts/ci/check_required_files.py

      - name: Validate release checklist structure
        run: python scripts/ci/check_release_checklist.py

      - name: Run docs smoke checks
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/ci/docs_smoke.py

      - name: Check external links in release docs
        run: python scripts/ci/check_links.py

      - name: Build package artifacts
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install from built wheel (smoke)
        run: |
          WHEEL=$(ls dist/slipcore-*.whl | head -n 1)
          python -m venv .venv-smoke
          source .venv-smoke/bin/activate
          pip install "$WHEEL"
          python -c "import os,tempfile; os.chdir(tempfile.gettempdir()); from slipcore import format_slip, parse_slip; wire=format_slip('a','b','Request','Task'); assert parse_slip(wire).wire==wire; print('wheel smoke OK')"
