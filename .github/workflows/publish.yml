name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine

      - name: Check required release files
        run: python scripts/ci/check_required_files.py

      - name: Validate release checklist structure
        run: python scripts/ci/check_release_checklist.py

      - name: Enforce release checklist completion
        if: github.event_name == 'release'
        run: python scripts/ci/check_release_checklist.py --require-checked

      - name: Run docs smoke checks
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/ci/docs_smoke.py

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest tests/ -v --tb=short

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
