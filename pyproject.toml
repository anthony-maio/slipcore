[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "slipcore"
version = "3.1.0"
description = "Token-efficient agent-to-agent coordination protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Slipstream Contributors"}]
keywords = ["agents", "llm", "coordination", "protocol", "a2a", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# ZERO DEPENDENCIES IN CORE
dependencies = []

[project.optional-dependencies]
ml = [
    "numpy>=1.24",
    "sentence-transformers>=2.2",
    "scikit-learn>=1.0",
]
a2a = [
    "httpx>=0.25",
]
dev = [
    "slipcore[ml,a2a]",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.5",
    "ruff>=0.1",
]
all = ["slipcore[ml,a2a]"]

[project.urls]
Homepage = "https://github.com/anthony-maio/slipcore"
Documentation = "https://github.com/anthony-maio/slipcore#readme"
Repository = "https://github.com/anthony-maio/slipcore"
Issues = "https://github.com/anthony-maio/slipcore/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/slipcore", "src/slipcore_ml"]

[tool.hatch.build]
include = ["src/slipcore/py.typed", "src/slipcore/data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"
markers = [
    "conformance: conformance test vectors",
    "slow: slow tests requiring ML dependencies",
]
